<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="yogaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#3730A3"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <radialGradient id="indigoGlow" cx="80%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#A5B4FC" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#yogaBg)"/>
  <rect width="1200" height="400" fill="url(#indigoGlow)"/>

  <!-- Lotus & Meditating Yogi Silhouette -->
  <g transform="translate(980, 200)">
    <circle cx="0" cy="0" r="140" fill="none" stroke="#C7D2FE" stroke-width="2" opacity="0.3"/>
    <!-- Lotus Petals -->
    <path d="M-60,70 C-90,30 -50,10 0,65 C50,10 90,30 60,70 Z" fill="#818CF8" opacity="0.5"/>
    <path d="M-40,75 C-70,45 -30,25 0,70 C30,25 70,45 40,75 Z" fill="#A5B4FC" opacity="0.6"/>
    <!-- Meditator Silhouette -->
    <circle cx="0" cy="-30" r="16" fill="#EEF2FF"/>
    <path d="M-22,25 C-22,0 -12,-10 0,-10 C12,-10 22,0 22,25 C22,45 15,60 0,60 C-15,60 -22,45 -22,25 Z" fill="#EEF2FF"/>
    <!-- Cross-legged Pose Base -->
    <ellipse cx="0" cy="50" rx="45" ry="12" fill="#EEF2FF"/>
    <!-- Prana Aura Ring -->
    <circle cx="0" cy="-5" r="55" fill="none" stroke="#FEF08A" stroke-width="2" stroke-dasharray="4 4" opacity="0.7"/>
  </g>

  <!-- Content -->
  <g transform="translate(80, 75)">
    <rect x="0" y="0" width="310" height="34" rx="17" fill="#C7D2FE" fill-opacity="0.25"/>
    <text x="20" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#C7D2FE" letter-spacing="2">&#x1F9D8;&#x200D;&#x2642;&#xFE0F; MINDFUL YOGA &amp; PRANA WELLNESS</text>

    <text x="0" y="95" font-family="'Cinzel', Georgia, serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="1">Sacred Space &amp; Asana Props</text>
    <text x="0" y="145" font-family="system-ui, sans-serif" font-size="20" font-weight="400" fill="#E0E7FF">Organic Cotton Mats, Hand-Hammered Tibetan Singing Bowls &amp; Brass Dhoop Burners</text>
    <text x="0" y="180" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#A5B4FC">Complement your dosha balance with aligned daily Sadhana</text>

    <g transform="translate(0, 215)">
      <rect x="0" y="0" width="220" height="48" rx="24" fill="#C7D2FE"/>
      <text x="32" y="30" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1E1B4B">Shop Yoga Props &#x2192;</text>
      <rect x="240" y="0" width="200" height="48" rx="24" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <text x="260" y="30" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Guided Asanas</text>
    </g>
  </g>
</svg>
