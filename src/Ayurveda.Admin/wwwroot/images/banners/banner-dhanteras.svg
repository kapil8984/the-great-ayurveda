<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="dhanterasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="80%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#dhanterasBg)"/>
  <rect width="1200" height="400" fill="url(#goldGlow)"/>

  <!-- Lord Dhanwantari Amrit Kalash Motif -->
  <g transform="translate(980, 200)">
    <circle cx="0" cy="0" r="140" fill="none" stroke="#FDE047" stroke-width="2" stroke-dasharray="4 4" opacity="0.4"/>
    <!-- Glowing Aura -->
    <circle cx="0" cy="10" r="90" fill="#FDE047" opacity="0.15"/>
    <!-- Golden Amrit Pitcher -->
    <ellipse cx="0" cy="-45" rx="25" ry="10" fill="#CA8A04"/>
    <path d="M-25,-45 L-15,-20 C-45,10 -50,60 -25,90 C0,110 30,110 50,85 C70,55 55,5 30,-20 L25,-45 Z" fill="#EAB308"/>
    <!-- Spout / Handle -->
    <path d="M-25,-20 C-65,-10 -65,30 -40,40" fill="none" stroke="#CA8A04" stroke-width="6"/>
    <ellipse cx="12" cy="95" rx="35" ry="10" fill="#A16207"/>
    <!-- Radiance Beams -->
    <circle cx="0" cy="20" r="8" fill="#FEF08A"/>
    <line x1="0" y1="-80" x2="0" y2="-65" stroke="#FEF08A" stroke-width="3" stroke-linecap="round"/>
    <line x1="60" y1="-50" x2="45" y2="-38" stroke="#FEF08A" stroke-width="3" stroke-linecap="round"/>
    <line x1="-60" y1="-50" x2="-45" y2="-38" stroke="#FEF08A" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Content -->
  <g transform="translate(80, 75)">
    <rect x="0" y="0" width="350" height="34" rx="17" fill="#FDE047" fill-opacity="0.2"/>
    <text x="20" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FDE047" letter-spacing="2">&#x1F3C6; DHANTERAS DHANWANTARI JAYANTI</text>

    <text x="0" y="95" font-family="'Cinzel', Georgia, serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="1">Invest in Lifelong Arogya</text>
    <text x="0" y="145" font-family="system-ui, sans-serif" font-size="20" font-weight="400" fill="#E0E7FF">Pure A2 Gir Cow Bilona Ghee, Silver-Capped Chyawanprash &amp; Suvarna Bhasma</text>
    <text x="0" y="180" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#FDE047">Special Offer: Free Kansa Vatki Foot Massager on Orders &#x2265; &#x20B9;2,499</text>

    <g transform="translate(0, 215)">
      <rect x="0" y="0" width="220" height="48" rx="24" fill="#FDE047"/>
      <text x="32" y="30" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1E1B4B">Shop Amrit Range &#x2192;</text>
      <rect x="240" y="0" width="200" height="48" rx="24" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <text x="265" y="30" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Dhanwantari Kit</text>
    </g>
  </g>
</svg>
