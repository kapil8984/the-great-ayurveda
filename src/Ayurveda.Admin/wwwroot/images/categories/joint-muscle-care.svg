<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="jointAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#FDE68A" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FEF3C7" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="jointCopper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="35%" stop-color="#EA580C" />
      <stop offset="75%" stop-color="#9A3412" />
      <stop offset="100%" stop-color="#7C2D12" />
    </linearGradient>
    <linearGradient id="jointOilDrop" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="jointLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#065F46" />
    </linearGradient>
    <filter id="jointShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7C2D12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Circular Backdrop -->
  <circle cx="80" cy="80" r="72" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
  <circle cx="80" cy="80" r="62" fill="url(#jointAura)" />

  <g opacity="0.35" stroke="#EA580C" stroke-width="1" fill="none">
    <circle cx="80" cy="80" r="54" stroke-dasharray="3 4" />
  </g>

  <!-- Therapeutic Oil Pot (Kindi / Taila Patra) -->
  <g filter="url(#jointShadow)">
    <!-- Pot Body -->
    <path d="M52 64 C50 82 62 94 80 94 C98 94 110 82 108 64 C106 54 96 50 80 50 C64 50 54 54 52 64 Z" fill="url(#jointCopper)" />
    <!-- Pot Rim -->
    <ellipse cx="80" cy="50" rx="18" ry="5" fill="#FDE68A" stroke="#9A3412" stroke-width="1" />
    <!-- Pot Highlights -->
    <path d="M58 64 C58 76 66 86 80 88 C72 84 66 76 66 64 C66 56 70 52 74 51 C64 52 58 56 58 64 Z" fill="#FED7AA" opacity="0.45" />

    <!-- Long Spout pouring oil -->
    <path d="M62 70 C52 72 40 78 36 84 C42 84 50 80 58 78 Z" fill="url(#jointCopper)" />
  </g>

  <!-- Golden Therapeutic Oil Droplet Falling from Spout -->
  <g filter="url(#jointShadow)">
    <path d="M80 102 C74 112 70 118 70 124 C70 131 74.5 136 80 136 C85.5 136 90 131 90 124 C90 118 86 112 80 102 Z" fill="url(#jointOilDrop)" />
    <!-- Gloss highlight on drop -->
    <ellipse cx="76" cy="122" rx="2.5" ry="5" fill="#FFFFFF" opacity="0.75" />
    <circle cx="80" cy="132" r="1.5" fill="#FEF08A" opacity="0.9" />
  </g>

  <!-- Gentle Ripple / Taila Pool at base -->
  <ellipse cx="80" cy="138" rx="28" ry="5" fill="#F59E0B" opacity="0.3" />
  <ellipse cx="80" cy="138" rx="18" ry="3" fill="#D97706" opacity="0.45" />

  <!-- Nirgundi & Eucalyptus Healing Botanical Leaves -->
  <g filter="url(#jointShadow)">
    <!-- Right Leaf -->
    <path d="M96 114 C112 110 126 118 128 132 C116 130 104 124 96 114 Z" fill="url(#jointLeaf)" />
    <path d="M98 116 C110 118 120 124 126 130" stroke="#A7F3D0" stroke-width="1" fill="none" opacity="0.7" />

    <!-- Left Leaf -->
    <path d="M64 118 C48 116 36 126 34 138 C46 134 56 128 64 118 Z" fill="url(#jointLeaf)" />
  </g>

  <!-- Warm Soothing Energy Aura Rays -->
  <path d="M42 46 L47 51" stroke="#F97316" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <path d="M80 34 L80 40" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <path d="M118 46 L113 51" stroke="#F97316" stroke-width="2" stroke-linecap="round" opacity="0.7" />
</svg>
