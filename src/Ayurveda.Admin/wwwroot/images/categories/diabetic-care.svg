<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="diabAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DCFCE7" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#BBF7D0" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#DCFCE7" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="diabKarela" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="40%" stop-color="#16A34A" />
      <stop offset="85%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#14532D" />
    </linearGradient>
    <linearGradient id="diabJamun" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#6B21A8" />
      <stop offset="100%" stop-color="#3B0764" />
    </linearGradient>
    <linearGradient id="diabGurmar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="diabShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14532D" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Circular Backdrop -->
  <circle cx="80" cy="80" r="72" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
  <circle cx="80" cy="80" r="62" fill="url(#diabAura)" />

  <g opacity="0.35" stroke="#15803D" stroke-width="1" fill="none">
    <circle cx="80" cy="80" r="54" stroke-dasharray="3 3" />
  </g>

  <!-- Fresh Ribbed Karela (Momordica charantia - Bitter Gourd) -->
  <g filter="url(#diabShadow)">
    <!-- Karela Stem -->
    <path d="M48 54 C54 48 60 48 66 52 L62 58 C58 56 54 56 50 60 Z" fill="#14532D" />

    <!-- Karela Curved Body -->
    <path d="M60 56 C74 58 96 74 104 94 C112 112 106 126 96 128 C86 130 76 116 68 98 C60 80 54 62 60 56 Z" fill="url(#diabKarela)" />

    <!-- Characteristic Bumpy Ridges (Knobs of Bitter Gourd) -->
    <path d="M62 66 Q68 64 70 70 Q76 68 78 76 Q86 76 88 84 Q94 86 96 96" stroke="#86EFAC" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M58 76 Q64 76 66 82 Q72 84 74 92 Q82 94 82 102 Q88 106 88 114" stroke="#86EFAC" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.75" />
    <circle cx="68" cy="72" r="2.5" fill="#4ADE80" />
    <circle cx="76" cy="84" r="2.5" fill="#4ADE80" />
    <circle cx="86" cy="94" r="2.5" fill="#4ADE80" />
    <circle cx="92" cy="108" r="2.5" fill="#4ADE80" />
  </g>

  <!-- Ripe Deep Purple Jamun Berries (Syzygium cumini - Blood Sugar Balancer) -->
  <g filter="url(#diabShadow)">
    <!-- Jamun Stem -->
    <path d="M106 88 C114 84 122 80 126 72" stroke="#451A03" stroke-width="1.8" stroke-linecap="round" fill="none" />

    <!-- Jamun Berry 1 -->
    <ellipse cx="118" cy="92" rx="10" ry="14" transform="rotate(20 118 92)" fill="url(#diabJamun)" />
    <ellipse cx="114" cy="87" rx="3" ry="6" transform="rotate(20 114 87)" fill="#E9D5FF" opacity="0.6" />

    <!-- Jamun Berry 2 -->
    <ellipse cx="106" cy="110" rx="9" ry="13" transform="rotate(-15 106 110)" fill="url(#diabJamun)" />
    <ellipse cx="103" cy="105" rx="2.5" ry="5" transform="rotate(-15 103 105)" fill="#E9D5FF" opacity="0.55" />
  </g>

  <!-- Gurmar (Gymnema sylvestre - "Sugar Destroyer") Vine Leaves -->
  <g filter="url(#diabShadow)">
    <path d="M42 96 C30 92 32 78 44 72 C52 80 50 90 42 96 Z" fill="url(#diabGurmar)" />
    <path d="M42 94 C46 86 46 78 44 72" stroke="#BBF7D0" stroke-width="1" fill="none" opacity="0.7" />

    <path d="M52 118 C38 120 34 108 44 102 C52 108 52 114 52 118 Z" fill="url(#diabGurmar)" />
  </g>

  <!-- Metabolic Balance Wellness Glow -->
  <circle cx="80" cy="38" r="2" fill="#22C55E" />
  <circle cx="128" cy="62" r="2.5" fill="#A855F7" />
  <circle cx="36" cy="62" r="2" fill="#EAB308" />
</svg>
