<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="digAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFEDD5" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#FED7AA" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFEDD5" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="digBronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="40%" stop-color="#B45309" />
      <stop offset="85%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>
    <linearGradient id="digGinger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="digLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <filter id="digShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#451A03" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Circular Backdrop -->
  <circle cx="80" cy="80" r="72" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
  <circle cx="80" cy="80" r="62" fill="url(#digAura)" />

  <!-- Sacred Geometric Ring -->
  <g opacity="0.35" stroke="#B45309" stroke-width="1" fill="none">
    <circle cx="80" cy="80" r="54" stroke-dasharray="4 3" />
  </g>

  <!-- Traditional Bronze Mortar & Pestle (Khalbatta) -->
  <g filter="url(#digShadow)">
    <!-- Mortar Base -->
    <ellipse cx="80" cy="128" rx="26" ry="6" fill="#451A03" />
    
    <!-- Mortar Body -->
    <path d="M50 86 C52 108 62 126 80 126 C98 126 108 108 110 86 C110 80 106 78 80 78 C54 78 50 80 50 86 Z" fill="url(#digBronze)" />
    
    <!-- Mortar Cavity Rim -->
    <ellipse cx="80" cy="84" rx="30" ry="8" fill="#78350F" stroke="#FBBF24" stroke-width="1.5" />
    <ellipse cx="80" cy="85" rx="25" ry="5.5" fill="#451A03" />

    <!-- Crushed Herbal Churna & Deepana Herbs inside Mortar -->
    <ellipse cx="80" cy="86" rx="22" ry="4.5" fill="#D97706" />
    <circle cx="75" cy="86" r="1.5" fill="#FEF3C7" />
    <circle cx="84" cy="85" r="1.2" fill="#FEF3C7" />
    <circle cx="88" cy="87" r="1.5" fill="#92400E" />

    <!-- Bronze Pestle (resting angled inside mortar) -->
    <path d="M96 52 C99 50 105 52 107 56 L88 94 C86 98 80 97 78 94 L75 88 L96 52 Z" fill="url(#digBronze)" />
    <ellipse cx="102" cy="54" rx="5" ry="3.5" transform="rotate(-30 102 54)" fill="#FDE68A" />
  </g>

  <!-- Fresh Cut Ginger Root (Adrak / Shunti) at base -->
  <g filter="url(#digShadow)">
    <path d="M38 120 C34 114 36 104 46 102 C52 100 54 106 58 110 C62 114 56 124 48 124 C42 124 40 122 38 120 Z" fill="url(#digGinger)" />
    <!-- Ginger Nodes -->
    <path d="M42 108 C46 110 46 116 43 120" stroke="#78350F" stroke-width="1" fill="none" opacity="0.6" />
    <ellipse cx="50" cy="110" rx="3.5" ry="2" fill="#FEF3C7" opacity="0.7" />
  </g>

  <!-- Triphala / Haritaki Dried Botanical Fruit -->
  <g filter="url(#digShadow)">
    <ellipse cx="118" cy="118" rx="8" ry="11" transform="rotate(25 118 118)" fill="#78350F" />
    <path d="M116 108 C120 114 120 122 116 128" stroke="#D97706" stroke-width="1" fill="none" opacity="0.7" />
    <ellipse cx="117" cy="114" rx="2" ry="4" fill="#FBBF24" opacity="0.5" />
  </g>

  <!-- Fresh Bay / Mint Digestive Leaf -->
  <g filter="url(#digShadow)">
    <path d="M48 94 C40 86 44 72 54 68 C60 76 58 88 48 94 Z" fill="url(#digLeaf)" />
    <path d="M48 92 C52 82 54 74 54 68" stroke="#DCFCE7" stroke-width="1" fill="none" opacity="0.7" />
  </g>

  <!-- Aromatic Digestive Essence Curls (Agni Fire / Deepana Steam) -->
  <path d="M72 68 C70 60 76 56 74 48 C72 42 75 38 74 34" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M84 64 C86 58 82 52 85 44 C87 38 84 34 86 30" stroke="#E3A72F" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.7" />
  <circle cx="74" cy="32" r="2" fill="#FBBF24" />
</svg>
