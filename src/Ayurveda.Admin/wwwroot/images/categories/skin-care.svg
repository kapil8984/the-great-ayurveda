<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="skinAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE4E6" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#FECDD3" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFE4E6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="skinBottle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="30%" stop-color="#EA580C" />
      <stop offset="75%" stop-color="#9A3412" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>
    <linearGradient id="skinPetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="60%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <filter id="skinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#881337" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Circular Backdrop -->
  <circle cx="80" cy="80" r="72" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
  <circle cx="80" cy="80" r="62" fill="url(#skinAura)" />

  <g opacity="0.35" stroke="#E11D48" stroke-width="1" fill="none">
    <circle cx="80" cy="80" r="54" stroke-dasharray="3 3" />
  </g>

  <!-- Blooming Lotus / Rose Petals Base -->
  <g filter="url(#skinShadow)">
    <!-- Back Petals -->
    <path d="M50 126 C44 114 54 104 68 110 C62 118 56 124 50 126 Z" fill="url(#skinPetal)" opacity="0.8" />
    <path d="M110 126 C116 114 106 104 92 110 C98 118 104 124 110 126 Z" fill="url(#skinPetal)" opacity="0.8" />

    <!-- Center Base Petal -->
    <path d="M64 130 C72 136 88 136 96 130 C90 122 70 122 64 130 Z" fill="#9F1239" />
    <path d="M60 128 C52 118 64 108 80 114 C68 122 62 126 60 128 Z" fill="url(#skinPetal)" />
    <path d="M100 128 C108 118 96 108 80 114 C92 122 98 126 100 128 Z" fill="url(#skinPetal)" />
  </g>

  <!-- Kumkumadi Saffron Oil Dropper Bottle -->
  <g filter="url(#skinShadow)">
    <!-- Glass Bottle Body -->
    <rect x="66" y="68" width="28" height="46" rx="6" fill="url(#skinBottle)" />
    <!-- Glass Gloss Reflection -->
    <rect x="69" y="72" width="4" height="38" rx="2" fill="#FFFFFF" opacity="0.5" />
    
    <!-- Bottle Label with Golden Border -->
    <rect x="70" y="78" width="20" height="24" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="0.8" />
    <circle cx="80" cy="90" r="3" fill="#E11D48" />

    <!-- Dropper Collar (Gold) -->
    <rect x="71" y="60" width="18" height="8" rx="2" fill="#FBBF24" stroke="#92400E" stroke-width="0.8" />
    <!-- Dropper Pipette Bulb (Black/Dark Walnut) -->
    <path d="M74 60 C74 52 77 46 80 46 C83 46 86 52 86 60 Z" fill="#451A03" />
  </g>

  <!-- Saffron (Kesar) Stigmas floating gracefully -->
  <g filter="url(#skinShadow)">
    <!-- Main Saffron Filament -->
    <path d="M104 62 C114 66 118 76 116 88" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <circle cx="116" cy="88" r="2" fill="#B91C1C" />
    
    <!-- Second Filament -->
    <path d="M100 52 C108 54 114 58 118 66" stroke="#EA580C" stroke-width="2" stroke-linecap="round" fill="none" />
    
    <!-- Third Filament -->
    <path d="M46 68 C40 74 38 84 42 92" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Skin Radiance Glow Particles -->
  <path d="M52 50 L53.5 53.5 L57 55 L53.5 56.5 L52 60 L50.5 56.5 L47 55 L50.5 53.5 Z" fill="#FB7185" />
  <path d="M112 40 L113 42.5 L115.5 43.5 L113 44.5 L112 47 L111 44.5 L108.5 43.5 L111 42.5 Z" fill="#F43F5E" />
  <circle cx="80" cy="38" r="2" fill="#FBBF24" />
</svg>
