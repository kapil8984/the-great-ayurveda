<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="femAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCE7F3" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#FBCFE8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FCE7F3" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="femPetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="50%" stop-color="#DB2777" />
      <stop offset="100%" stop-color="#9D174D" />
    </linearGradient>
    <linearGradient id="femShatavari" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="60%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="femFoliage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#065F46" />
    </linearGradient>
    <filter id="femShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#831843" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Circular Backdrop -->
  <circle cx="80" cy="80" r="72" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
  <circle cx="80" cy="80" r="62" fill="url(#femAura)" />

  <g opacity="0.35" stroke="#DB2777" stroke-width="1" fill="none">
    <circle cx="80" cy="80" r="54" stroke-dasharray="3 3" />
  </g>

  <!-- Shatavari (Asparagus racemosus) Tuberous Roots Base -->
  <g filter="url(#femShadow)">
    <!-- Root Cluster Tuber 1 -->
    <path d="M68 110 C62 120 54 130 52 136 C56 138 66 128 72 118 Z" fill="url(#femShatavari)" />
    <!-- Root Cluster Tuber 2 -->
    <path d="M78 114 C76 126 74 136 76 142 C82 142 86 132 84 118 Z" fill="url(#femShatavari)" />
    <!-- Root Cluster Tuber 3 -->
    <path d="M88 112 C96 122 104 132 108 138 C110 134 102 124 94 114 Z" fill="url(#femShatavari)" />
  </g>

  <!-- Sacred Blooming Lotus / Rose of Vitality (Hormonal Balance & Stree Rasayana) -->
  <g filter="url(#femShadow)">
    <!-- Outer Broad Petals -->
    <path d="M48 88 C40 74 54 62 70 70 C64 80 56 86 48 88 Z" fill="url(#femPetal)" opacity="0.85" />
    <path d="M112 88 C120 74 106 62 90 70 C96 80 104 86 112 88 Z" fill="url(#femPetal)" opacity="0.85" />

    <!-- Side Petals -->
    <path d="M54 94 C48 82 62 72 78 80 C70 90 62 94 54 94 Z" fill="url(#femPetal)" />
    <path d="M106 94 C112 82 98 72 82 80 C90 90 98 94 106 94 Z" fill="url(#femPetal)" />

    <!-- Central Upright Sacred Lotus Petal -->
    <path d="M80 54 C70 66 68 86 80 98 C92 86 90 66 80 54 Z" fill="url(#femPetal)" />
    <!-- Central Highlights -->
    <path d="M80 58 C74 68 74 84 80 94 C77 84 76 72 80 58 Z" fill="#FDF2F8" opacity="0.6" />
    
    <!-- Golden Core / Pericarp Seed of Life -->
    <circle cx="80" cy="88" r="4.5" fill="#FDE047" stroke="#D97706" stroke-width="0.8" />
  </g>

  <!-- Shatavari Feathery Needle Foliage -->
  <g filter="url(#femShadow)">
    <path d="M46 76 C38 68 34 54 36 44" stroke="#059669" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <path d="M38 58 Q32 54 30 48" stroke="#34D399" stroke-width="1.2" stroke-linecap="round" fill="none" />
    <path d="M42 66 Q48 60 52 54" stroke="#34D399" stroke-width="1.2" stroke-linecap="round" fill="none" />

    <path d="M114 76 C122 68 126 54 124 44" stroke="#059669" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <path d="M122 58 Q128 54 130 48" stroke="#34D399" stroke-width="1.2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Golden Harmony Particles & Prana Sparks -->
  <path d="M50 46 L51.5 49.5 L55 51 L51.5 52.5 L50 56 L48.5 52.5 L45 51 L48.5 49.5 Z" fill="#F472B6" />
  <path d="M110 40 L111.5 43.5 L115 45 L111.5 46.5 L110 50 L108.5 46.5 L105 45 L108.5 43.5 Z" fill="#FDE047" />
  <circle cx="80" cy="38" r="2.5" fill="#F472B6" />
</svg>
