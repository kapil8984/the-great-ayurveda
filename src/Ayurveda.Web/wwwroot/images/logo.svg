<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C7E50" />
      <stop offset="100%" stop-color="#143F27" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3C35B" />
      <stop offset="100%" stop-color="#C68E22" />
    </linearGradient>
  </defs>
  
  <!-- Herbal Leaf Lotus Mark -->
  <g transform="translate(15, 10)">
    <!-- Outer lotus petals -->
    <path d="M 40,80 C 15,65 10,35 40,15 C 70,35 65,65 40,80 Z" fill="url(#leafGrad)" />
    <path d="M 40,80 C 20,60 15,40 25,25 C 40,40 38,60 40,80 Z" fill="url(#goldGrad)" opacity="0.85" />
    <path d="M 40,80 C 60,60 65,40 55,25 C 40,40 42,60 40,80 Z" fill="url(#goldGrad)" opacity="0.85" />
    <!-- Center Leaf Sprout -->
    <path d="M 40,75 C 33,55 35,35 40,22 C 45,35 47,55 40,75 Z" fill="#FBF6EA" />
    <circle cx="40" cy="18" r="4" fill="url(#goldGrad)" />
  </g>

  <!-- Typography -->
  <text x="105" y="48" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#1F5E3B" letter-spacing="1">THE GREAT</text>
  <text x="105" y="78" font-family="Georgia, serif" font-size="22" font-weight="600" fill="#E3A72F" letter-spacing="4">AYURVEDA</text>
</svg>
