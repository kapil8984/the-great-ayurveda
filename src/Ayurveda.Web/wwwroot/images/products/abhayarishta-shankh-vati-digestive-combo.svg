<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_abhayarishta-shankh-vati-digestive-combo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="sunGlow_abhayarishta-shankh-vati-digestive-combo" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_abhayarishta-shankh-vati-digestive-combo" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Card Background -->
  <rect width="200" height="200" rx="16" fill="#F8FAFC"/>
  <rect width="200" height="200" rx="16" fill="url(#bgGrad_abhayarishta-shankh-vati-digestive-combo)"/>
  <circle cx="100" cy="110" r="75" fill="url(#sunGlow_abhayarishta-shankh-vati-digestive-combo)"/>

  <!-- Top Category Pill -->
  <g transform="translate(100, 18)">
    <rect x="-65" y="0" width="130" height="15" rx="7.5" fill="#047857" fill-opacity="0.9"/>
    <text x="0" y="10.5" font-family="system-ui, sans-serif" font-size="6.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">Digestive Care</text>
  </g>

  <!-- Product Illustration -->
  <g filter="url(#shadow_abhayarishta-shankh-vati-digestive-combo)">
            <!-- Traditional Pill Container -->
        <rect x="75" y="65" width="50" height="15" rx="3" fill="#E2E8F0"/>
        <rect x="70" y="80" width="60" height="95" rx="10" fill="#1E293B"/>
        <rect x="70" y="95" width="60" height="65" fill="#F8FAFC"/>
        <text x="100" y="115" font-family="'Cinzel', Georgia, serif" font-size="7" font-weight="700" fill="#0F172A" text-anchor="middle">GHANVATI</text>
        <line x1="75" y1="120" x2="125" y2="120" stroke="#34D399" stroke-width="1"/>
        <text x="100" y="132" font-family="system-ui, sans-serif" font-size="6" font-weight="700" fill="#047857" text-anchor="middle">60 VEG TABLETS</text>
        <text x="100" y="145" font-family="system-ui, sans-serif" font-size="5" fill="#64748B" text-anchor="middle">CLASSICAL EXTRACT</text>
  </g>

  <!-- Bottom Title Badge -->
  <g transform="translate(10, 178)">
    <rect x="0" y="0" width="180" height="16" rx="8" fill="#FFFFFF" opacity="0.95" stroke="#E2E8F0" stroke-width="0.8"/>
    <text x="90" y="11" font-family="system-ui, sans-serif" font-size="7" font-weight="700" fill="#0F172A" text-anchor="middle">Abhayarishta & Shankh Vat...</text>
