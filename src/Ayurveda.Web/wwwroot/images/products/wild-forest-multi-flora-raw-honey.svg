<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_wild-forest-multi-flora-raw-honey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#92400E" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="sunGlow_wild-forest-multi-flora-raw-honey" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow_wild-forest-multi-flora-raw-honey" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Card Background -->
  <rect width="200" height="200" rx="16" fill="#F8FAFC"/>
  <rect width="200" height="200" rx="16" fill="url(#bgGrad_wild-forest-multi-flora-raw-honey)"/>
  <circle cx="100" cy="110" r="75" fill="url(#sunGlow_wild-forest-multi-flora-raw-honey)"/>

  <!-- Top Category Pill -->
  <g transform="translate(100, 18)">
    <rect x="-65" y="0" width="130" height="15" rx="7.5" fill="#D97706" fill-opacity="0.9"/>
    <text x="0" y="10.5" font-family="system-ui, sans-serif" font-size="6.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">Honey, Ghee & Natural Foods</text>
  </g>

  <!-- Product Illustration -->
  <g filter="url(#shadow_wild-forest-multi-flora-raw-honey)">
            <!-- Amber Glass Jar -->
        <rect x="65" y="70" width="70" height="15" rx="3" fill="#D97706" opacity="0.8"/>
        <rect x="60" y="85" width="80" height="85" rx="10" fill="#78350F"/>
        <rect x="65" y="90" width="70" height="75" rx="6" fill="#92400E"/>
        <rect x="65" y="105" width="70" height="50" rx="3" fill="#FFFBEB"/>
        <text x="100" y="125" font-family="'Cinzel', Georgia, serif" font-size="8" font-weight="700" fill="#78350F" text-anchor="middle">THE GREAT AYURVEDA</text>
        <line x1="72" y1="130" x2="128" y2="130" stroke="#D97706" stroke-width="0.8"/>
        <text x="100" y="142" font-family="system-ui, sans-serif" font-size="7" font-weight="600" fill="#1C1917" text-anchor="middle">PURE SHODHANA</text>
  </g>

  <!-- Bottom Title Badge -->
  <g transform="translate(10, 178)">
    <rect x="0" y="0" width="180" height="16" rx="8" fill="#FFFFFF" opacity="0.95" stroke="#E2E8F0" stroke-width="0.8"/>
    <text x="90" y="11" font-family="system-ui, sans-serif" font-size="7" font-weight="700" fill="#0F172A" text-anchor="middle">Wild Forest Multi-Flora R...</text>
  </g>
</svg>