<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="winterBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <radialGradient id="frostGlow" cx="80%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#winterBg)"/>
  <rect width="1200" height="400" fill="url(#frostGlow)"/>

  <!-- Winter Immunity Herb Shield Motif -->
  <g transform="translate(970, 200)">
    <circle cx="0" cy="0" r="135" fill="none" stroke="#7DD3FC" stroke-width="2" opacity="0.3"/>
    <!-- Ayurvedic Shield -->
    <path d="M0,-85 C65,-85 85,-40 85,25 C85,75 40,110 0,130 C-40,110 -85,75 -85,25 C-85,-40 -65,-85 0,-85 Z" fill="#0284C7" opacity="0.25" stroke="#38BDF8" stroke-width="2"/>
    <!-- Herbs Inside Shield: Ashwagandha & Amla -->
    <circle cx="0" cy="20" r="28" fill="#F59E0B"/>
    <circle cx="-25" cy="5" r="20" fill="#10B981"/>
    <circle cx="25" cy="5" r="20" fill="#10B981"/>
    <!-- Cross / Caduceus Glow -->
    <path d="M-15,20 L15,20 M0,5 L0,35" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <text x="0" y="70" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#E0F2FE" text-anchor="middle" letter-spacing="1">OJAS SHIELD</text>
  </g>

  <!-- Content -->
  <g transform="translate(80, 75)">
    <rect x="0" y="0" width="310" height="34" rx="17" fill="#38BDF8" fill-opacity="0.2"/>
    <text x="20" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#38BDF8" letter-spacing="2">&#x2744;&#xFE0F; WINTER IMMUNITY SHIELD</text>

    <text x="0" y="95" font-family="'Cinzel', Georgia, serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="1">Pacify Vata &amp; Fortify Respiration</text>
    <text x="0" y="145" font-family="system-ui, sans-serif" font-size="20" font-weight="400" fill="#BAE6FD">Cold-pressed Sesame Taila, Pure Sitopaladi Churna, &amp; Saffron Chyawanprash</text>
    <text x="0" y="180" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#7DD3FC">Up to 25% Off Winter Wellness Care Bundles</text>

    <g transform="translate(0, 215)">
      <rect x="0" y="0" width="220" height="48" rx="24" fill="#38BDF8"/>
      <text x="32" y="30" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Explore Immunity &#x2192;</text>
      <rect x="240" y="0" width="200" height="48" rx="24" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <text x="270" y="30" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Winter Tailas</text>
    </g>
  </g>
</svg>
