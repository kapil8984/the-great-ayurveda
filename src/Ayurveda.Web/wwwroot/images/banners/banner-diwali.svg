<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="diwaliBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A0E17"/>
      <stop offset="50%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>
    <radialGradient id="diwaliGlow" cx="85%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4A0E17" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="diyaFlame" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="40%" stop-color="#FDE047"/>
      <stop offset="80%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#diwaliBg)"/>
  <rect width="1200" height="400" fill="url(#diwaliGlow)"/>

  <!-- Decorative Rangoli / Mandalas -->
  <g transform="translate(980, 200)" opacity="0.25">
    <circle cx="0" cy="0" r="160" fill="none" stroke="#FDE68A" stroke-width="2" stroke-dasharray="8 6"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="#FBBF24" stroke-width="2"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#FDE68A" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#FBBF24" stroke-width="1"/>
    <path d="M0,-160 L20,-120 L0,-80 L-20,-120 Z" fill="#FBBF24"/>
    <path d="M0,160 L20,120 L0,80 L-20,120 Z" fill="#FBBF24"/>
    <path d="M-160,0 L-120,20 L-80,0 L-120,-20 Z" fill="#FBBF24"/>
    <path d="M160,0 L120,20 L80,0 L120,-20 Z" fill="#FBBF24"/>
  </g>

  <!-- Traditional Brass Diya Artwork -->
  <g transform="translate(980, 210)">
    <!-- Base / Diya Bowl -->
    <ellipse cx="0" cy="55" rx="90" ry="24" fill="#B45309"/>
    <path d="M-85,55 C-70,95 70,95 85,55 Z" fill="#D97706"/>
    <ellipse cx="0" cy="53" rx="80" ry="18" fill="#F59E0B"/>
    <ellipse cx="0" cy="51" rx="70" ry="12" fill="#78350F"/>
    <!-- Flame Aura -->
    <circle cx="0" cy="15" r="45" fill="#FDE047" opacity="0.3"/>
    <!-- Flame Path -->
    <path d="M0,-35 C20,10 25,35 0,45 C-25,35 -20,10 0,-35 Z" fill="url(#diyaFlame)"/>
    <!-- Sparkles -->
    <circle cx="-50" cy="-20" r="3" fill="#FEF08A" opacity="0.8"/>
    <circle cx="45" cy="-30" r="4" fill="#FEF08A" opacity="0.8"/>
    <circle cx="-25" cy="-60" r="2.5" fill="#FEF08A" opacity="0.9"/>
    <circle cx="35" cy="5" r="3" fill="#FEF08A" opacity="0.7"/>
  </g>

  <!-- Left Content -->
  <g transform="translate(80, 75)">
    <rect x="0" y="0" width="310" height="34" rx="17" fill="#FBBF24" fill-opacity="0.25"/>
    <text x="20" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FDE68A" letter-spacing="2">&#x2728; SHUBH DIWALI MAHOTSAV SALE</text>

    <text x="0" y="95" font-family="'Cinzel', Georgia, serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="1">Divine Radiance &amp; Rejuvenation</text>
    <text x="0" y="145" font-family="system-ui, sans-serif" font-size="20" font-weight="400" fill="#FDE68A">Flat 30% OFF on Classical Kumkumadi, Bilona Ghee &amp; Rasayanas</text>
    <text x="0" y="180" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#FED7AA">Use Coupon: <tspan fill="#FFF" font-weight="800" text-decoration="underline">DIWALI30</tspan> | Free Festive Brass Diya on Orders Over &#x20B9;999</text>

    <!-- CTAs -->
    <g transform="translate(0, 215)">
      <rect x="0" y="0" width="220" height="48" rx="24" fill="#F59E0B"/>
      <text x="32" y="30" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#451A03">Shop Diwali Deals &#x2192;</text>
      <rect x="240" y="0" width="200" height="48" rx="24" fill="none" stroke="#FDE68A" stroke-width="2"/>
      <text x="270" y="30" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#FDE68A">View Gift Boxes</text>
    </g>
  </g>
</svg>
