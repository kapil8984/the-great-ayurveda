<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="yGradsurya-namaskar.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#yGradsurya-namaskar.svg)"/>
  <circle cx="200" cy="130" r="70" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.3"/>
  
  <!-- Stylized Meditating Human Silhouette -->
  <g transform="translate(200, 130)" fill="#FFFFFF" opacity="0.9">
    <circle cx="0" cy="-45" r="16"/>
    <!-- Torso -->
    <path d="M-18,-20 C-18,-20 0,-25 18,-20 C22,10 15,30 0,35 C-15,30 -22,10 -18,-20 Z"/>
    <!-- Folded legs -->
    <path d="M-45,30 C-30,20 -10,32 0,35 C10,32 30,20 45,30 C50,38 35,45 0,46 C-35,45 -50,38 -45,30 Z"/>
    <!-- Folded prayer hands -->
    <path d="M-6,-15 L6,-15 L4,-2 L-4,-2 Z"/>
  </g>

  <rect x="0" y="220" width="400" height="80" fill="#000000" fill-opacity="0.4"/>
  <text x="200" y="252" font-family="'Cinzel', Georgia, serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Surya Namaskar</text>
  <text x="200" y="276" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#CBD5E1" text-anchor="middle">Sun Salutation Sequence</text>
</svg>